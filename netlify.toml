# French URL rewrites: serve the English file under the clean French path (URL stays).
[[redirects]]
  from = "/fr"
  to = "/"
  status = 200

[[redirects]]
  from = "/fr/a-propos"
  to = "/about"
  status = 200

[[redirects]]
  from = "/fr/programmes"
  to = "/programs"
  status = 200

[[redirects]]
  from = "/fr/impliquez-vous"
  to = "/get-involved"
  status = 200

[[redirects]]
  from = "/fr/evenements"
  to = "/events"
  status = 200

[[redirects]]
  from = "/fr/nouvelles"
  to = "/news"
  status = 200

[[redirects]]
  from = "/fr/nouvelle"
  to = "/news-single"
  status = 200

[[redirects]]
  from = "/fr/carrieres"
  to = "/careers"
  status = 200

[[redirects]]
  from = "/fr/contact"
  to = "/contact"
  status = 200

[[redirects]]
  from = "/fr/faire-un-don"
  to = "/donate"
  status = 200

# Team profile pages: clean URLs serve the team HTML files (URL stays).
[[redirects]]
  from = "/team/*"
  to = "/team/:splat"
  status = 200

[[redirects]]
  from = "/fr/equipe/*"
  to = "/team/:splat"
  status = 200
