name: Link check

on:
  pull_request:
    branches: [main]
  schedule:
    # Every Monday at 09:00 UTC (05:00 EDT / 04:00 EST)
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  lychee:
    name: Check for broken links
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check links with lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # fragment checking is disabled: lychee resolves #fragments against the base url and reports false positives. anchors are same-page and verified separately.
          # x.com is excluded: X returns 403 to all automated scanners
          # (anti-bot), so it can only be verified manually.
          # instagram.com is excluded: Instagram rate-limits automated scanners
          # (429 + login redirect loop), same false-positive class as x.com.
      # ybspburundi.org is excluded: the site is intermittently unresponsive
      # and times out the checker (same false-positive class as x.com and instagram.com).
          # zeffy.com is excluded: Zeffy returns 403 to automated scanners
          # (bot protection), same false-positive class as x.com.
          # ybspcanada.org/fr/* is excluded: French URLs 404 pre-merge;
          # they resolve only after deploy via Netlify rewrites (not broken links).
          # ybspcanada.org/team/* is excluded: team profile URLs 404 pre-merge;
          # they resolve only after deploy via Netlify rewrites (not broken links).
          # the new dossy-roxana-igiraneza.jpg is excluded: the image file is added
          # by the PR itself, so it 404s on production until merge + deploy.
          # base url lets root-relative links resolve
          args: "--verbose --no-progress --timeout 60 --base https://ybspcanada.org --exclude 'x.com' --exclude 'instagram.com' --exclude 'ybspburundi.org' --exclude 'zeffy.com' --exclude 'https?://ybspcanada\\.org/fr(/.*)?' --exclude 'https?://ybspcanada\\.org/team(/.*)?' --exclude 'https?://ybspcanada\\.org/images/team/dossy-roxana-igiraneza\\.jpg' './**/*.html'"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
