name: Link check

on:
  pull_request:
    branches: [main]
  schedule:
    # Every Monday at 09:00 UTC (05:00 EDT / 04:00 EST)
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  lychee:
    name: Check for broken links
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check links with lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Scan every HTML file, including #anchor fragment links.
          # x.com is excluded: X returns 403 to all automated scanners
          # (anti-bot), so it can only be verified manually.
          # instagram.com is excluded: Instagram rate-limits automated scanners
          # (429 + login redirect loop), same false-positive class as x.com.
      # ybspburundi.org responds slowly (~18s), so raise the timeout from the 20s default.
          args: "--verbose --no-progress --include-fragments --timeout 60 --exclude 'x.com' --exclude 'instagram.com' './**/*.html'"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
