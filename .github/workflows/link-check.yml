name: Link check

on:
  schedule:
    # Every Monday at 09:00 UTC (05:00 EDT / 04:00 EST)
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  lychee:
    name: Check for broken links
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check links with lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Scan every HTML file, including #anchor fragment links
          args: "--verbose --no-progress --include-fragments './**/*.html'"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
