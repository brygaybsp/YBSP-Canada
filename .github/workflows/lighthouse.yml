name: Lighthouse CI

on:
  deployment_status:

jobs:
  lighthouse:
    name: Audit Netlify deploy preview
    # Only run for successful Netlify deploy previews, never production deploys
    if: >
      github.event.deployment_status.state == 'success' &&
      contains(github.event.deployment_status.target_url, 'deploy-preview')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Lighthouse on the preview URL
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ github.event.deployment_status.target_url }}
          uploadArtifacts: true
          temporaryPublicStorage: true
